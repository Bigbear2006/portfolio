- title: ClassFlow
  short_description: Сайт для управления организациями дополнительного образования.
  problem: |
    Создать сайт где любой пользователь может создать свою организацию, добавлять курсы и группы,
    составлять расписание и контролировать посещаемость и оплаты.
    Сайт ориентирован на небольшие организации дополнительного образования.
    С технической стороны надо предусмотреть изоляцию данных различных организаций и права доступа,
    а также необходимо собирать базовые метрики - количество запросов, время ответа и т.д.
  solution: |
    Сделал мультитенантную платформу с четырьмя ролями (владелец, администратор,
    учитель, ученик) и разными правами доступа. Реализовал управление участниками,
    групповыми и индивидуальными курсами, расписанием, посещаемостью и оплатами,
    а также регистрацию с подтверждением почты. Изоляцию данных организаций
    обеспечил на уровне БД через Row-Level Security. Файлы хранятся в S3,
    метрики собираются в Prometheus и показываются в Grafana.
  icon: graduation-cap
  slug: classflow
  type: PET
  url: https://classflow.ru
  github: https://github.com/Bigbear2006/classflow
  year: 2026
  role: SOLO
  stack:
    - Python
    - FastAPI
    - Sqlalchemy
    - TypeScript
    - React
    - PostgreSQL
    - Redis
    - Docker
    - Nginx
    - Prometheus
    - Grafana

- title: EventHub
  short_description: Сайт для регистрации на мероприятия.
  problem: |
    На хакатоне нужно было быстро сделать удобный сервис для регистрации
    на мероприятия с отзывами. Нужно было предусмотреть ограничение числа
    мест и не позволять спамить, постоянно регистрируясь и отменяя регистрацию
    на мероприятия.
  solution: |
    Сделал сайт, где пользователь просматривает мероприятия, регистрируется
