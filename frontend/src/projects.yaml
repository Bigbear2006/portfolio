- title: Automated Browser
  short_description: ИИ-агент, который управляет браузером по командам на естественном языке.
  description: |
    Проект для управления браузером обычными текстовыми командами. Агент работает
    с реальным браузером через Playwright (CDP) и решает задачу пользователя, вызывая набор
    инструментов: переход по страницам, извлечение элементов, клики, ввод текста и другие.
    Система построена на трёх агентах на базе openai-agents. Главный агент (interactor)
    принимает запрос и делегирует работу двум субагентам через механизм handoff:
    extractor разбирает структуру страницы и ищет элементы по ключевым словам,
    navigator отвечает за переходы по URL и вкладки. Конфигурация агентов вынесена в agents.yaml.
  icon: github
  slug: automated-browser
  type: PET
  github: https://github.com/Bigbear2006/automated-browser
  year: 2026
  role: SOLO
  features:
    - Управление реальным браузером через Playwright (CDP)
    - Мультиагентная архитектура на openai-agents с передачей задач (handoff)
    - Агент interactor работает с элементами страницы, extractor ищет их, navigator управляет вкладками
    - Набор инструментов - навигация, извлечение элементов, клики, ввод текста
    - Агенты описываются декларативно в agents.yaml

