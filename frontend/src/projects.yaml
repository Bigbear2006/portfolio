- title: Нейрошеф
  short_description: Telegram Web App для помощи в управлении рестораном и кухней.
  description: |
    Мини-приложение внутри телеграм, которое убирает рутину в работе шеф-повара:
    помогает составить новое меню, график смен или проанализоровать поставщиков.
    Пользователь может прикреплять к своему вопросу Фото, Файлы (PDF, Excel) или записывать вопрос голосом.
    В ответ бот может прислать не только текст, но и готовый PDF или Excel Файл.
    Работает по подписке с оплатой через Юкассу, есть тестовый период.
  problem: |
    Шеф-повара тратят много времени на рутину: составление меню, графиков смен,
    анализ поставщиков. Им нужен помощник, который работает прямо в мессенджере,
    принимает вопросы в любом удобном виде и отвечает готовыми документами.
  solution: |
    Сделал Telegram Web App с ИИ-ассистентом. Он принимает текст, голос, фото и файлы
    (PDF, Excel), а в ответ присылает текст или готовые PDF и Excel. Добавил подписку
    с тестовым периодом и оплатой через ЮKassa.
  logo: logos/neurochef.png
