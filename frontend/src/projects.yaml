- title: ClassFlow
  short_description: Сайт для управления организациями дополнительного образования.
  description: |
    Сайт для управления образовательными организациями.
    Любой пользователь может создать свою организацию или присоединиться к существующей.
    Реализованы четыре роли (владелец, администратор, учитель, ученик) с разными правами доступа.
    Сайт предоставляет функционал для управления участниками организации,
    групповыми и индивидуальными курсами, расписанием,
    а также позволяет вести учёт посещаемости и оплат.
  problem: |
    Организациям дополнительного образования не хватает одного инструмента для учёта
    участников, курсов, расписания, посещаемости и оплат. При этом данные разных
    организаций на одной платформе не должны пересекаться.
  solution: |
    Сделал мультитенантную платформу с четырьмя ролями и разными правами доступа.
    Изоляцию данных организаций обеспечил на уровне БД через Row-Level Security.
    Файлы хранятся в S3, метрики собираются в Prometheus и показываются в Grafana.
  icon: graduation-cap
  slug: classflow
  type: PET
  url: https://classflow.ru
  github: https://github.com/Bigbear2006/classflow
  year: 2026
  role: SOLO
  features:
    - Регистрация с подтверждением почты
    - Мультитенантность и изоляция данных разных организаций на уровне БД (Row-Level Security)
    - Хранение файлов в S3
    - Сбор и отображение метрик с помощью Prometheus и Grafana
  stack:
    - Python
    - FastAPI
    - Sqlalchemy
    - TypeScript
    - React
    - PostgreSQL
    - Redis
    - Docker
    - Nginx
    - Prometheus
    - Grafana

