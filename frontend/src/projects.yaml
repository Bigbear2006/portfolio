- title: VibeFix
  short_description: Лендинг для доработки проектов после ИИ.
  description: |
    Сайт-визитка для привлечения клиентов, у которых проект почти работает, но требует доработки.
    На сайте описаны услуги, показаны кейсы, собраны ответы на частые вопросы и есть форма обратной связи.
    К сайту подключены сервисы мониторинга и аналитики: ошибки отслеживаются в Sentry,
