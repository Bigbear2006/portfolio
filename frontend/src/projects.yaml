- title: DOM KIT
  short_description: Telegram-бот для подбора квартир в жилом комплексе.
  description: |
    Бот помогает покупателям искать квартиры в жилом комплексе двумя способами:
    через фильтры или визуально, выбирая очередь, секцию и этаж по картинкам.
    Квартиры можно добавлять в избранное и подписываться на изменения (например, цены).
    Внутри бота также есть новости и акции, а заявки и вопросы автоматически уходят в Bitrix.
    Одна из задач - огромный объём фото, видео и документов. Каждый файл
    загружается на сервера Telegram один раз и дальше отправляется по file_id,
    поэтому бот отвечает быстро и не загружает файлы повторно.
  problem: |
    Покупателям сложно ориентироваться в квартирах жилого комплекса: очереди, секции,
    этажи, много фото, видео и документов. Застройщику нужно, чтобы заявки сразу
    попадали в CRM.
  solution: |
    Сделал Telegram-бота с поиском по фильтрам и визуальным выбором очереди, секции
    и этажа по картинкам. Квартиры можно добавлять в избранное и подписываться на
    изменения. Заявки уходят в Bitrix. Каждый медиафайл загружается в Telegram один раз
    и дальше отправляется по file_id, поэтому бот отвечает быстро.
  logo: logos/dom-kit.png
  slug: dom-kit
  type: COMMERCIAL
  year: 2025
  company: BOTTEC
  role: SOLO
  features:
    - Огромный объём медиа (фото, видео, документы) - каждый файл загружается в Telegram один раз и дальше отправляется по file_id
    - Визуальный поиск по картинкам (очередь, секция, этаж) и по фильтрам
    - Подписки на изменения квартир с уведомлениями
