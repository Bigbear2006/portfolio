- title: Нейрошеф
  short_description: Telegram Web App для помощи в управлении рестораном и кухней.
  description: |
    Мини-приложение внутри телеграм, которое убирает рутину в работе шеф-повара:
    помогает составить новое меню, график смен или проанализоровать поставщиков.
    Пользователь может прикреплять к своему вопросу Фото, Файлы (PDF, Excel) или записывать вопрос голосом.
    В ответ бот может прислать не только текст, но и готовый PDF или Excel Файл.
    Работает по подписке с оплатой через Юкассу, есть тестовый период.
  logo: src/assets/logos/neurochef.png
  slug: neurochef
  type: COMMERCIAL
  year: 2026
  company: BOTTEC
  role: SOLO
  features:
    - Обработка фото, файлов и аудио в вопросах
    - Генерация PDF и Excel файлов в ответе
    - Система подписок и прием платежей через Юкассу

- title: ClassFlow
  short_description: Сайт для управления организациями дополнительного образования.
  description: |
    Сайт для управления образовательными организациями.
    Любой пользователь может создать свою организацию или присоединиться к существующей.
    Реализованы четыре роли (владелец, администратор, учитель, ученик) с разными правами доступа.
    Сайт предоставляет функционал для управления участниками организации,
    групповыми и индивидуальными курсами, расписанием,
    а также позволяет вести учёт посещаемости и оплат.
  icon: graduation-cap
  slug: classflow
  type: PET
  url: classflow.ru
  github: https://github.com/Bigbear2006/classflow
  year: 2026
  role: SOLO
  features:
    - JWT-Авторизация с подтверждением почты
    - Изоляция данных разных организаций на уровне БД (Row-Level Security
    - Хранение файлов в S3
    - Сбор и отображение метрик с помощью Prometheus и Grafana

- title: Telegram Bot Template
  short_description: Шаблон телеграм бота c админ-панелью и настроенным деплоем.
  description: |
    Стартовый шаблон, в который я собрал всё, что повторялось в десятках моих Telegram-ботов.
    В репозитории собрано все для рабочей основы: админ-панель на Django,
    фоновые задачи на Celery и Redis, контейнеризацию в Docker, Nginx и настроенный CI/CD.
    В проекте есть ruff для линтинга и mypy для типизации, а часто нужные middleware и фильтры уже написаны.
    Это намного сокращает время на старт нового проекта.
  icon: github
  slug: telegram-bot-template
  type: PET
  github: https://github.com/Bigbear2006/aiogram-django-template
  year: 2026
  role: SOLO
  features:
    - aiogram + Django с админ-панелью
    - Celery и Redis для фоновых задач
    - Docker, Nginx и CI/CD для деплоя в один шаг
    - Линтинг ruff и строгая типизация mypy
    - Готовые middleware и фильтры

- title: DOM KIT
  short_description: Telegram-бот для поиска квартир в жилом комплексе
  description: |
    Бот помогает покупателям искать квартиры в жилом комплексе двумя способами:
    через фильтры или визуально, выбирая очередь, секцию и этаж по картинкам.
    Квартиры можно добавлять в избранное и подписываться на изменения (например, цены).
    Внутри бота также есть новости и акции, а заявки и вопросы автоматически уходят в Bitrix.
    Главная инженерная задача — огромный объём фото, видео и документов. Каждый файл
    загружается на сервера Telegram один раз и дальше отправляется по file_id,
    поэтому бот отвечает быстро и не загружает файлы повторно.
  logo: src/assets/logos/dom-kit.png
  slug: dom-kit
  type: COMMERCIAL
  year: 2025
  company: BOTTEC
  role: SOLO
  features:
    - Поиск по фильтрам и по картинкам (очередь, секция, этаж)
    - Избранное и подписка на обновления (например, изменение цены)
    - Заявки и вопросы автоматически отправляются в Bitrix
    - Новости и акции застройщика
    - Файлы загружаются в Telegram один раз и отправляются по file_id

- title: Работа в ПВЗ
  short_description: Telegram-бот для поиска сотрудников и работы в ПВЗ
  description: |
    Площадка для найма в пунктах выдачи заказов прямо в Telegram.
    Работодатель регистрирует свои ПВЗ и создаёт смены, а соискатель получает подборку
    подходящих вакансий по навыкам и местоположению. Навыки можно подтвердить квизами,
    а реферальная система помогает боту расти за счёт самих пользователей.
  logo: src/assets/logos/pickup-points.png
  slug: pickup-points
  type: COMMERCIAL
  year: 2025
  company: BOTTEC
  role: SOLO
  features:
    - 'Две роли: работник и работодатель'
    - Управление ПВЗ и создание смен
    - Подбор вакансий по навыкам и местоположению
    - Проверка навыков квизами
    - Реферальная система

